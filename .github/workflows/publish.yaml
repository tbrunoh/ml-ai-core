name: Publish to GitHub Packages

on:
  push:
    branches: main
    tags:
      - '*'  # Adjust if using another branch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to fetch all tags

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install --upgrade setuptools wheel twine
  
      - name: Build the package
        run: python setup.py sdist bdist_wheel

      - name: Publish to GitHub Packages
        run: |
          echo "${{ secrets.GH_TOKEN }}" | python -m pip install --user --upgrade twine
          python -m twine upload --repository-url https://upload.github.com/tbrunoh/ml-ai-core/ dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GH_TOKEN }}
